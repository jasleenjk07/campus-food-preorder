# Nginx reverse proxy for Cravix API on a VPS.
# 1. Replace api.yourdomain.com with your domain (or use IP temporarily without SSL).
# 2. Copy to: /etc/nginx/sites-available/cravix
# 3. Enable:  sudo ln -s /etc/nginx/sites-available/cravix /etc/nginx/sites-enabled/
# 4. Test:    sudo nginx -t && sudo systemctl reload nginx
# 5. SSL:     sudo certbot --nginx -d api.yourdomain.com

upstream cravix_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://cravix_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket realtime updates: /api/v1/ws
    location /api/v1/ws {
        proxy_pass http://cravix_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://cravix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }
}
