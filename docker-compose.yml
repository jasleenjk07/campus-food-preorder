services:

  postgres:
    image: postgres:15
    container_name: campus_postgres
    environment:
      POSTGRES_USER: cravix
      POSTGRES_PASSWORD: cravix123
      POSTGRES_DB: campus_food
    ports:
      - "5432:5432"
    volumes: #This prevents data loss.
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: campus_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: campus_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://cravix:cravix123@postgres:5432/campus_food
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    
  celery:
    build: ./backend
    container_name: campus_celery
    command: celery -A app.core.celery_app worker --loglevel=info --queues=notifications
    depends_on:
      - redis
      - postgres
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://cravix:cravix123@postgres:5432/campus_food
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development

volumes:
  postgres_data: